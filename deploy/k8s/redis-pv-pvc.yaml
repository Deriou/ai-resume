apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-resume-redis-data-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /opt/ai-resume/redis-data
    type: DirectoryOrCreate
  claimRef:
    namespace: ai-resume
    name: ai-resume-redis-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-resume-redis-data-pvc
  namespace: ai-resume
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
  volumeName: ai-resume-redis-data-pv
