apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-resume-config
  namespace: ai-resume
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"

  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql.cloud-ops.svc.cluster.local:3306/db_airesume?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: "airesume"

  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_TIMEOUT: "3s"

  AIRESUME_UPLOAD_BASE_DIR: "/app/uploads"
  AIRESUME_UPLOAD_MAX_FILE_SIZE: "10MB"
  SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "10MB"
  SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "12MB"

  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
