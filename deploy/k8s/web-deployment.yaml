apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-resume-web
  namespace: ai-resume
  labels:
    app: ai-resume-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-resume-web
  template:
    metadata:
      labels:
        app: ai-resume-web
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: ai-resume-web
          image: crpi-ekwujpeg6f954ar3.cn-wulanchabu.personal.cr.aliyuncs.com/cloud-ops-hub/ai-resume-web:manual
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
