spring:
  application:
    name: ai-resume
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

airesume:
  upload:
    base-dir: uploads
    max-file-size: 10MB
    allowed-extensions:
      - pdf
      - doc
      - docx
  llm:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
      timeout: 30s
